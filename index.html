<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Anatomy of Heat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Special+Elite&display=swap">
<style>
/* Layout concept: the essay set as a magazine feature, one spread at a time. Every word of the copy appears once, in reading order. Ground alternates paper, ink and red; treatment alternates type, voices and drawn scenes. Sources sit in a closed drawer. */
:root{
  --bg:#F6F8F8; --ink:#242829; --mute:#545B5F; --rule:#D3D9DB; --red:#B3302A; --tint:#E7EDED;
  --inv-bg:#242829; --inv-fg:#F6F8F8; --inv-mute:#A9B3B6; --inv-red:#FF7266; --inv-rule:#444C4F;
  --hot-bg:#B3302A; --hot-fg:#F6F8F8;
  --sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono','Courier New',monospace;
  --type:'Special Elite','Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131617; --ink:#EEF2F2; --mute:#9AA4A8; --rule:#323A3D; --red:#E8685F; --tint:#1C2123;
  --inv-bg:#EEF2F2; --inv-fg:#131617; --inv-mute:#545B5F; --inv-red:#B3302A; --inv-rule:#C4CCCE;
  --hot-bg:#E8685F; --hot-fg:#131617; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131617; --ink:#EEF2F2; --mute:#9AA4A8; --rule:#323A3D; --red:#E8685F; --tint:#1C2123;
  --inv-bg:#EEF2F2; --inv-fg:#131617; --inv-mute:#545B5F; --inv-red:#B3302A; --inv-rule:#C4CCCE;
  --hot-bg:#E8685F; --hot-fg:#131617; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.deck{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.top,.bar{display:flex;align-items:center;gap:16px;padding:10px clamp(16px,3vw,40px);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:var(--bg);position:relative;z-index:30}
.top{border-bottom:1px solid var(--rule)}
.bar{border-top:1px solid var(--rule);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.brand{color:var(--ink);font-weight:500;white-space:nowrap}
.mv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:700px){.mv,.lbl{display:none}}
/* 16:9 only. The frame is a fixed 1600 x 900 canvas, scaled to fit the stage. Nothing scrolls. */
.stage{position:relative;min-height:0;overflow:hidden;background:color-mix(in srgb,var(--ink) 10%,var(--bg))}
.frame{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--k,.6));transform-origin:center;background:var(--bg);overflow:hidden;--fs:1}
.card{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg);color:var(--ink);padding:64px 88px 92px}
.card.on{display:grid;grid-template-columns:minmax(0,1fr);align-content:safe center;animation:in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.inv{--bg:var(--inv-bg);--ink:var(--inv-fg);--mute:var(--inv-mute);--red:var(--inv-red);--rule:var(--inv-rule);--tint:color-mix(in srgb,var(--inv-fg) 9%,var(--inv-bg))}
.card.hot{--bg:var(--hot-bg);--ink:var(--hot-fg);--mute:color-mix(in srgb,var(--hot-fg) 78%,var(--hot-bg));--red:var(--hot-fg);--rule:color-mix(in srgb,var(--hot-fg) 40%,var(--hot-bg));--tint:color-mix(in srgb,var(--hot-fg) 12%,var(--hot-bg))}
.kick{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.kick b{color:var(--red);font-weight:500}
.sh{font-weight:700;letter-spacing:-.03em;line-height:1;font-size:calc(66px*var(--fs));text-wrap:balance;margin:0}
.sh .rn{color:var(--red);margin-right:.25em}
.subh{font-weight:500;letter-spacing:-.015em;line-height:1.15;font-size:calc(36px*var(--fs));text-wrap:balance;margin:0}
.tx{display:flex;flex-direction:column;gap:calc(20px*var(--fs));min-width:0}
.tx p{margin:0;font-size:calc(25px*var(--fs));line-height:1.5;max-width:700px;text-wrap:pretty}
.tx p.lead{font-size:calc(34px*var(--fs));line-height:1.35;font-weight:500;letter-spacing:-.01em}
.tx p.d{font-weight:600;font-size:calc(54px*var(--fs));line-height:1.05;letter-spacing:-.025em;max-width:760px;text-wrap:balance}
.tx p.dx{font-weight:700;font-size:calc(170px*var(--fs));line-height:.95;letter-spacing:-.05em;color:var(--red)}
.tx p.stack{font-weight:600;font-size:calc(84px*var(--fs));line-height:1.04;letter-spacing:-.03em;display:flex;flex-direction:column}
.tx p.stack span:nth-child(2){padding-left:.6em}
.tx p.stack span:nth-child(3){padding-left:1.2em;color:var(--red)}
.tx strong{font-weight:600}
.qf{margin:0;display:flex;flex-direction:column;gap:10px}
.qf blockquote{margin:0;border-top:3px solid var(--ink);padding-top:16px;font-weight:500;font-size:calc(44px*var(--fs));line-height:1.15;letter-spacing:-.015em;text-wrap:pretty;max-width:640px}
.qf.sm blockquote{font-size:calc(30px*var(--fs));max-width:640px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:72px;align-items:center}
.split>*{min-width:0}
.solo{display:flex;flex-direction:column;gap:24px;justify-content:center;max-width:1100px}
.vs{display:flex;flex-direction:column;gap:10px}
svg{display:block;max-width:100%;max-height:640px;height:auto;margin-inline:auto}
svg text{font-family:var(--mono);fill:var(--ink)}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:0}
.pr>div{padding:32px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pr .a{background:var(--tint)}
.pr .b{background:var(--inv-bg);--ink:var(--inv-fg);--mute:var(--inv-mute);--red:var(--inv-red);color:var(--inv-fg)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:2px solid var(--ink)}
.tri>div{padding:26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tri>div+div{border-left:2px solid var(--ink)}
/* chrome */
.ctrl{display:flex;gap:8px;align-items:center}
.btn{background:transparent;border:1px solid var(--rule);padding:8px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);line-height:1}
.btn:hover,.btn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.nav{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default}
.ev-open{position:absolute;right:48px;bottom:36px;z-index:6;font-size:14px;padding:11px 16px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.trackw{flex:1;min-width:0;height:22px;position:relative;cursor:pointer;display:block;border:0;background:transparent;padding:0}
.trackw .tk{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--rule)}
.trackw .fl{position:absolute;left:0;top:9px;height:4px;background:var(--red);width:0;transition:width .3s}
.trackw .tick{position:absolute;top:4px;width:2px;height:14px;background:var(--mute)}
.drawer{position:absolute;top:0;bottom:0;width:min(560px,100%);background:var(--bg);color:var(--ink);z-index:20;transition:transform .35s cubic-bezier(.2,.7,.2,1);overflow-y:auto;padding:24px clamp(16px,2.4vw,32px) 48px;visibility:hidden}
.drawer.r{right:0;border-left:3px solid var(--ink);transform:translateX(102%)}
.drawer.l{left:0;border-right:3px solid var(--ink);transform:translateX(-102%)}
.drawer.open{transform:none;visibility:visible}
.drawer h3{font-size:22px;letter-spacing:-.01em;margin:6px 0 4px;font-weight:600}
.drawer h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:24px 0 8px;font-weight:500}
.drawer p,.drawer li{font-size:15px;line-height:1.5}
.drawer ul{padding-left:18px;margin:6px 0}
.drawer blockquote{margin:10px 0;padding:2px 0 2px 14px;border-left:3px solid var(--ink);font-size:16px;line-height:1.4;font-weight:500}
.drawer blockquote small{display:block;font-family:var(--type);font-weight:400;font-size:12px;color:var(--mute);margin-top:4px}
.drawer .x{float:right}
.toc{display:grid;gap:0;margin:14px 0 0;padding:0;list-style:none}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--rule);width:100%;box-sizing:border-box;font-size:15px;line-height:1.3}
.toc button:hover{color:var(--red)}
.toc button:focus-visible{outline:2px solid var(--red)}
.toc .n{font-family:var(--mono);font-size:12px;color:var(--red)}
.toc .c{font-family:var(--mono);font-size:11px;color:var(--mute)}
.toc .cur{font-weight:600}
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:18;display:none}
.scrim.on{display:block}
/* page furniture */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.cover h1{margin:0;font-weight:700;letter-spacing:-.05em;line-height:.9;font-size:calc(150px*var(--fs));text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--red)}
.cover .sub2{font-weight:500;font-size:calc(44px*var(--fs));letter-spacing:-.02em;margin:26px 0 0}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dash 2.4s .4s ease-out forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.ann{opacity:0;animation:fadeslow .5s both}
@keyframes fadeslow{from{opacity:0}to{opacity:1}}
.legend{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;font-size:17px}
.legend b{font-family:var(--mono);font-weight:500;width:24px;height:24px;border-radius:50%;background:var(--red);color:var(--bg);display:grid;place-items:center;font-size:12px}
.sc{position:relative;border:2px solid var(--ink);padding:44px;display:flex;flex-direction:column;gap:20px}
.sc .num{font-weight:700;font-size:150px;line-height:.8;letter-spacing:-.06em;color:var(--red)}
.sc h2{margin:0;font-weight:700;font-size:62px;letter-spacing:-.03em;line-height:1}
.sc.k1{background:var(--tint)}
.sc.k2{background:var(--inv-bg);color:var(--inv-fg);--ink:var(--inv-fg);--mute:var(--inv-mute);--red:var(--inv-red);border-color:var(--ink)}
.sc.k3{border-style:dashed}
.sc.k4{background:var(--hot-bg);border-color:var(--hot-bg);color:var(--hot-fg);--ink:var(--hot-fg);--red:var(--hot-fg);--mute:var(--hot-fg)}
.sc.k5{box-shadow:10px 10px 0 var(--ink)}
.cw{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:center}
/* photographic chapter openers: full-bleed photograph, text only, no drawn overlays */
.card.photopage{padding:0;display:none}
.card.photopage.on{display:block}
.photo-bleed{position:absolute;inset:0;overflow:hidden;background:#28221f;isolation:isolate;color:#fff;--ink:#fff;--mute:rgba(255,255,255,.82);--red:#FF7266;--rule:rgba(255,255,255,.4);--bg:#28221f}
.photo-bleed img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;filter:saturate(.94) contrast(1.07)}
.photo-bleed:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,12,11,.84),rgba(16,12,11,.5) 46%,rgba(16,12,11,.08) 74%);z-index:1}
.photo-copy{position:absolute;z-index:2;left:0;top:0;bottom:0;width:860px;padding:64px 70px 92px 88px;display:flex;flex-direction:column;justify-content:safe center;overflow:hidden}
.photo-copy .vs,.photo-copy svg{display:none}
.photo-copy .split,.photo-copy .cover{display:block}
.photo-copy .solo{max-width:none}
.photo-credit{position:absolute;z-index:3;left:88px;bottom:30px;color:rgba(255,255,255,.8);font-size:11px;font-family:var(--mono);letter-spacing:.04em}
.photopage .ev-open{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){.card.on,.ann{animation:none;opacity:1}.draw{animation:none;stroke-dashoffset:0}.drawer,.trackw .fl{transition:none}}
</style>
<div class="deck" id="deck">
  <header class="top"><span class="brand">The Anatomy of Heat</span><span class="mv" id="mv"></span><span class="count" id="count"></span></header>
  <main class="stage" id="stage" aria-live="polite">
    <div class="frame" id="frame"></div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer l" id="toc" aria-label="Contents" aria-hidden="true"></aside>
    <aside class="drawer r" id="evid" aria-label="Explore the Evidence" aria-hidden="true"></aside>
  </main>
  <footer class="bar">
    <div class="ctrl"><button class="btn nav" id="prev" aria-label="Previous page">&larr;</button><button class="btn nav" id="next" aria-label="Next page">&rarr;</button></div>
    <button class="trackw" id="track" aria-label="Progress. Select a point to jump."><span class="tk"></span><span class="fl" id="fl"></span><span id="ticks"></span></button>
    <div class="ctrl">
      <button class="btn" id="bc" aria-expanded="false" title="Contents (C)">Contents</button>
      <button class="btn" id="be" aria-expanded="false" title="Explore the Evidence (E)">Evidence</button>
      <button class="btn" id="bt" title="Toggle light and dark" aria-label="Toggle light and dark">&#9680;</button>
    </div>
  </footer>
</div>
<script>
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function bits(n,seed,cx,cy,rx,ry,o={}){const red=o.red??.35,size=o.size??7,r=rnd(seed);let s='';for(let i=0;i<n;i++){const a=r()*6.283,d=Math.sqrt(r()),x=cx+Math.cos(a)*d*rx,y=cy+Math.sin(a)*d*ry,w=size*(.6+r()*.9),rot=Math.round(r()*180),R=r()<red;s+=`<rect x="${(x-w/2).toFixed(1)}" y="${(y-w/3).toFixed(1)}" width="${w.toFixed(1)}" height="${(w*.66).toFixed(1)}" rx="1" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${R?'var(--red)':'var(--ink)'}" opacity="${R?.9:.82}"/>`}return s}
function spoon(tx,ty,sc,rot,o={}){const oil=o.oil??.2,n=o.n??46,size=o.size??7;return `<g transform="translate(${tx} ${ty}) rotate(${rot}) scale(${sc})"><path d="M60 8 Q150 22 270 -36" stroke="var(--ink)" stroke-width="13" fill="none" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="72" ry="46" fill="var(--tint)" stroke="var(--ink)" stroke-width="4"/><ellipse cx="0" cy="6" rx="62" ry="36" fill="var(--red)" opacity="${oil}"/>${bits(n,o.seed??5,0,3,56,30,{size,red:o.red??.35})}</g>`}
const IL=t=>'';
const VS=(svg,cap)=>`<div class="vs">${svg}${cap?IL(cap):''}</div>`;
const V={};
V.cover=()=>VS(`<svg viewBox="0 0 800 380" role="img" aria-label="A spoonful of chili crisp">${spoon(300,200,2.05,0,{seed:21,n:90,size:10,oil:.22})}</svg>`,'Illustration of a spoonful.');
V.five=()=>{const pts=[['A',300,168],['B',140,226],['C',560,92],['D',392,250],['E',300,236]],it=['intensity','development','duration','location','feeling'];
return VS(`<svg viewBox="0 0 800 380" role="img" aria-label="One spoonful with five marked dimensions of heat">${spoon(300,200,2.05,0,{seed:21,n:90,size:10,oil:.22})}${pts.map((p,i)=>`<g class="ann" style="animation-delay:${.4+i*.6}s"><circle cx="${p[1]}" cy="${p[2]}" r="17" fill="var(--red)"/><text x="${p[1]}" y="${p[2]+5}" text-anchor="middle" font-size="16" font-weight="500" style="fill:var(--bg)">${p[0]}</text></g>`).join('')}</svg><ul class="legend">${it.map((t,i)=>`<li class="ann" style="animation-delay:${.4+i*.6}s"><b>${pts[i][0]}</b><span>${t}</span></li>`).join('')}</ul>`,'Illustration. The five dimensions are named by the researchers; the positions are drawn for effect.')};
V.crescendo=()=>{let d='M20 150',x=20;for(let i=0;i<64;i++){x+=9;const a=2+i*.9;d+=` L${x} ${150+Math.sin(i*.95)*a}`}
return VS(`<svg viewBox="0 0 620 300" role="img" aria-label="A wave that begins almost imperceptibly and swells"><line x1="20" y1="150" x2="600" y2="150" stroke="var(--rule)" stroke-width="2"/><path class="draw" d="${d}" fill="none" stroke="var(--red)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" pathLength="1200"/></svg>`,'Illustration of a crescendo. Not a measurement.')};
V.music=()=>VS(`<svg viewBox="0 0 640 340" role="img" aria-label="A curve with an opening, a build, a climax and a finish"><line x1="30" y1="290" x2="620" y2="290" stroke="var(--ink)" stroke-width="3"/><path class="draw" d="M30 270 C110 266 150 230 220 170 C290 110 330 40 390 40 C450 40 470 190 520 240 C550 262 580 268 620 270" fill="none" stroke="var(--red)" stroke-width="7" stroke-linecap="round" pathLength="1200"/>${[['opening',70],['a build',210],['a climax',370],['a finish',540]].map(p=>`<text x="${p[1]}" y="322" font-size="15" text-anchor="middle" style="letter-spacing:.06em">${p[0]}</text>`).join('')}</svg>`,'Illustration. Not a measurement.');
V.curves2=()=>`<svg viewBox="0 0 300 150" role="img" aria-label="Illustrative heat curves"></svg>`;
const curveSvg=(d,lbl)=>`<svg viewBox="0 0 320 170" role="img" aria-label="${lbl}"><line x1="20" y1="140" x2="310" y2="140" stroke="var(--mute)" stroke-width="2"/><line x1="20" y1="10" x2="20" y2="140" stroke="var(--mute)" stroke-width="2"/><path class="draw" d="${d}" fill="none" stroke="var(--red)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1200"/></svg>`;
const spike='M20 136 L120 128 L128 20 L150 18 C170 20 176 70 210 118 L310 130';
const plateau='M20 136 C90 132 140 90 190 56 C230 32 260 30 310 30';
V.bowl=()=>VS(`<svg viewBox="0 0 760 420" role="img" aria-label="A bowl of fragrant food with steam rising"><line x1="0" y1="360" x2="760" y2="360" stroke="var(--ink)" stroke-width="5"/><path d="M230 230 Q230 346 380 350 Q530 346 530 230Z" fill="var(--tint)" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/><ellipse cx="380" cy="230" rx="150" ry="28" fill="var(--bg)" stroke="var(--ink)" stroke-width="6"/>${bits(26,9,380,230,110,16,{size:9,red:.3})}<g fill="none" stroke="var(--mute)" stroke-width="5" stroke-linecap="round"><path d="M330 186 q-14 -24 0 -46 q14 -22 0 -44"/><path d="M382 182 q-14 -24 0 -46 q14 -22 0 -44"/><path d="M434 186 q-14 -24 0 -46 q14 -22 0 -44"/></g></svg>`,'Illustration.');

pg(2,'',SP(HD(2)+P(`Fuchsia Dunlop has spent much of her writing life exploring the remarkable complexity of Sichuan cooking.`)+P(`In <i>The Food of Sichuan</i>, she describes the local erjingtiao chile as prized for its fragrance and <strong>“gently building heat.”</strong>`)+P(`Consider those three words.`),`<div class="tx"><p class="stack"><span>Gently.</span><span>Building.</span><span>Heat.</span></p>${P(`They suggest something developing gradually, a sensation that grows rather than strikes.`)}</div>`),{src:[DFS]});
pg(2,'inv',SP(P(`Elsewhere, describing Sichuan pepper, Dunlop writes of a <strong>“great crescendo of tingliness.”</strong>`)+P(`It's a marvelous description because it gives a physical sensation the language of music.`)+P(`Something begins almost imperceptibly. It gathers strength. It rises. The mouth starts to buzz.`)+P(`The sensation has movement, duration and character.`)+P(`In <i>Shark's Fin and Sichuan Pepper</i>, Dunlop makes another fascinating distinction. Sichuan's famous <i>ma la</i>, the combination of numbing and hot sensations, should awaken the palate rather than simply overwhelm it.`)+P(`Heat, in this telling, can make us more attentive to the food we're eating.`)+P(`This is much richer than our familiar mild, medium and hot classifications.`),V.crescendo()),{src:[DFS,DSF]});
pg(2,'',SP(L(`Sensory scientists Ivette Guzmán and Paul Bosland give us a vocabulary for understanding why. They distinguish five dimensions of chile heat: its intensity, development, duration, location and feeling.`)+P(`In other words, two sensations can be equally intense while unfolding in completely different ways.`)+P(`One arrives immediately. Another takes its time.`)+P(`One burns the tongue. Another is felt in the throat.`)+P(`One disappears. Another remains long after the food has been swallowed.`)+Dd(`<strong>The strength of heat is only one part of its character.</strong>`),V.five()),{src:[GB],note:`The Guzmán and Bosland panel evaluated pepper varieties, not finished chili crisp products.`});

pg(3,'',SO(HD(3)+P(`In <i>The Food of Sichuan</i>, Dunlop describes a rabbit dish from Zigong through the way heat and fragrance rise together.`)+P(`The food doesn't simply taste hot.`)+P(`Its character develops as it is eaten.`)),{src:[DFS]});
pg(3,'inv',SO(P(`Austin Bush, writing in <i>The Food of Southern Thailand</i>, gives us another beautifully precise description of a steamed fish curry.`)+P(`The dish is soft and silky, fragrant with herbs, and carries <strong>“a subtle sting of dried chiles and black peppercorns.”</strong>`)+Dd(`Subtle sting.`)+P(`Two words that tell us something quite different from scorching, fiery or blazing.`)+P(`The heat is present, but so are the softness and fragrance surrounding it.`)+P(`It has a particular relationship to the rest of the dish.`)),{src:[DFS,BU]});
pg(3,'',`<div class="solo" style="max-width:none"><div class="tx">${P(`Now consider two ordinary eaters describing chili crisp.`)}</div><div class="pr"><div class="a"><div class="tx">${P(`One Momofuku customer complains:`)}${Q(`“Just... zero flavor, then BAM! your tongue is on fire.”`,'sm')}</div>${curveSvg(spike,'Illustrative curve: a sudden spike')}</div><div class="b"><div class="tx">${P(`Another, reviewing Fly By Jing, says:`)}${Q(`“I enjoy how it builds and then just evens out.”`,'sm')}</div>${curveSvg(plateau,'Illustrative curve: a climb that levels off')}</div></div><div class="tx">${P(`The first person's experience is an ambush. The second person's is a gradual climb followed by a welcome plateau.`)}${IL('The two curves are illustrations of the descriptions. They are not measured data.')}</div></div>`,{q:[R.mo,R.fbj]});

pg(4,'',SP(HD(4)+P(`One of the most compelling things about Asian food writing is the precision with which authors describe sensations working together.`)+P(`In Sichuan cooking, the numbing sensation of Sichuan pepper can appear alongside aromatic chile oil, sweetness, sourness, crispness and richness.`)+P(`In southern Thai cooking, heat can be tempered or transformed by coconut milk, herbs, acidity and accompanying dishes.`)+P(`A meal may contain something intensely spicy beside something gentle and cooling.`)+P(`The pleasure emerges from the relationships.`),V.table()),{src:[DFS,BU]});
